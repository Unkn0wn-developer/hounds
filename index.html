<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d0e">
  <title>GreyHounds Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <section class="mu-head">
      <div class="chips" id="chips"></div>
      <div class="mu-row">
        <div class="mu-id">
          <span class="mu-avatar" id="muAvatar"></span>
          <h1 id="muName">GreyHounds</h1>
        </div>
        <div class="mu-info">
          <div class="eyebrow">Information</div>
          <div class="stats" id="stats"></div>
        </div>
      </div>
    </section>

    <nav class="tabs" aria-label="Sections">
      <button class="tab active" type="button">Members <span class="count" id="tabCount">0</span></button>
    </nav>

    <section class="panel">
      <div class="panel-top">
        <div>
          <h2>Members</h2>
          <p class="range" id="range">Loading…</p>
        </div>
        <div class="tools">
          <label class="search">
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
            <input id="filterText" type="search" placeholder="Search by name…" aria-label="Search by name">
          </label>
          <select id="filterStatus" aria-label="Filter by pill status">
            <option value="all">All pills</option>
            <option value="buffed">Buffed</option>
            <option value="neutral">Ready</option>
            <option value="debuffed">Debuffed</option>
          </select>
          <select id="sortSelect" class="only-sm" aria-label="Sort by">
            <option value="role">Sort: Role</option>
            <option value="member">Sort: Name</option>
            <option value="buff">Sort: Pill</option>
            <option value="health">Sort: Health</option>
            <option value="damage">Sort: Lifetime dmg</option>
            <option value="seen">Sort: Last seen</option>
            <option value="reset">Sort: Skills reset</option>
          </select>
          <button id="btnSortDir" class="only-sm" type="button" aria-label="Reverse order">↕</button>
          <button id="btnRefresh" type="button">Refresh</button>
          <button id="btnPause" type="button">Pause</button>
        </div>
      </div>

      <div class="banner" id="errorBanner" hidden></div>

      <div class="tablewrap">
        <table id="roster">
          <thead>
            <tr>
              <th data-sort="member">Name</th>
              <th data-sort="buff">Pill</th>
              <th data-sort="health">Resources</th>
              <th data-sort="damage" class="num">Lifetime dmg</th>
              <th data-sort="seen">Last seen</th>
              <th data-sort="reset">Skills reset</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <p class="status" id="statusLine" role="status">Starting…</p>
    <p class="foot">Live data from WarEra's public API. Click a row for more stats, click a column header to sort.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
